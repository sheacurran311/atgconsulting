openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /intake:
    post:
      operationId: submitIntake
      summary: Submit the original three-step questionnaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeInput"
      responses:
        "200":
          description: Personalised recommendations (or honeypot acknowledgement)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeResult"
        "400":
          description: Invalid JSON
        "422":
          description: Invalid form fields
        "429":
          description: Too many submissions
        "500":
          description: Unable to save the submission
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    IntakeInput:
      type: object
      required: [name, email, role, industry, bizSize, areas, aiComfort, tools, timeSinks, hoursLost, preferredHelp]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 200 }
        role: { type: string, minLength: 1, maxLength: 100 }
        industry: { type: string, minLength: 1, maxLength: 100 }
        bizSize: { type: string, enum: [solo, "2-10", "11-50", "50+"] }
        areas:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: string, enum: [executive_assistant, marketing, sales, customer_support] }
        aiComfort: { type: integer, minimum: 0, maximum: 4 }
        tools:
          type: array
          minItems: 1
          items: { type: string, enum: [chatgpt, claude, gemini, grok, copilot, zapier_make, crm, none, other] }
        timeSinks:
          type: array
          minItems: 1
          items: { type: string, enum: [email, prospecting, followups, research, proposals, scheduling, social_content, admin, personal_logistics] }
        automateFirst: { type: string, maxLength: 120 }
        hoursLost: { type: integer, minimum: 1, maximum: 40 }
        preferredHelp: { type: string, enum: [self_serve, guided, done_for_you, not_sure] }
        freeText: { type: string, maxLength: 280 }
        honeypot: { type: string, default: "" }
    IntakeResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        response:
          $ref: "#/components/schemas/TailoredRecommendation"
    TailoredRecommendation:
      type: object
      required: [aiLevelSummary, workflows, quickWin, recommendedTier, tierRationale, ctaText, type]
      properties:
        aiLevelSummary: { type: string }
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRecommendation"
        quickWin: { type: string }
        recommendedTier: { type: string, enum: [self_serve, guided, done_for_you] }
        tierRationale: { type: string }
        ctaText: { type: string }
        type: { type: string, enum: [llm, fallback] }
    WorkflowRecommendation:
      type: object
      required: [area, title, description]
      properties:
        area: { type: string, enum: [executive_assistant, marketing, sales, customer_support] }
        title: { type: string }
        description: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

